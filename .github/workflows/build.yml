steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Set up Java
    uses: actions/setup-java@v4
    with:
      distribution: zulu
      java-version: '17'

  - name: Set up Flutter
    uses: subosito/flutter-action@v2
    with:
      channel: stable
      flutter-version: '3.24.5'
      cache: true

  - name: Generate Android project
    run: flutter create . --org com.alshaheen.fishingaccounts --project-name fishing_boat_accounts --platforms=android --no-pub

  - name: Remove generated sample test
    run: rm -rf test

  - name: Install dependencies
    run: flutter pub get

  - name: Check code
    run: flutter analyze

  - name: Build APK
    run: flutter build apk --release

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: hesabat-alabari-apk
      path: build/app/outputs/flutter-apk/app-release.apk
